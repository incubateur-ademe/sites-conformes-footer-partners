[project]
name = "sites-conformes-footer-partners"
version = "0.1.0"
description = "Sitewide DSFR footer partner logos (fr-footer__partners) for sites-conformes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "Framework :: Wagtail",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "wagtail>=6.0",
    "sites-conformes>=4.0",
]

[project.urls]
Homepage = "https://github.com/incubateur-ademe/sites-conformes-footer-partners"
Repository = "https://github.com/incubateur-ademe/sites-conformes-footer-partners"
Changelog = "https://github.com/incubateur-ademe/sites-conformes-footer-partners/blob/main/CHANGELOG.md"
Issues = "https://github.com/incubateur-ademe/sites-conformes-footer-partners/issues"

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sites_conformes_footer_partners"
